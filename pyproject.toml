[project]
name = "gmail-ai-processor"
version = "0.1.0"
description = "AI-powered email classification and processing for Gmail"
requires-python = ">=3.12"
dependencies = [
    # Cloud Functions deps
    "google-api-python-client>=2.150.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-logging>=3.10.0",
    "flask>=3.0.0",
    # Dashboard deps
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "langchain-anthropic>=1.3.2",
    "pytest>=9.0.2",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/requirements.txt"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
